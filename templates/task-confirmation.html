<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Reja O'chirish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .delete-container {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transform: translateY(0);
            animation: fadeInUp 0.6s ease-out;
        }

        h2 {
            color: #333;
            margin-bottom: 40px;
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            z-index: 0;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-cancel {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-cancel:hover {
            background: #e9ecef;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-delete {
            background: #ff4757;
            color: white;
        }

        .btn-delete:hover {
            background: #ff3742;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        /* Анимация при клике */
        .btn:active {
            transform: scale(0.95);
        }

        /* Дополнительная анимация для кнопки удаления */
        .btn-delete::after {
            content: '🗑️';
            margin-left: 8px;
            transition: transform 0.3s;
        }

        .btn-delete:hover::after {
            transform: rotate(90deg);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .delete-container {
                padding: 30px 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <h2>"{{ task.title }}" rejangizni o'chirmoqchimisiz?</h2>

        <div class="button-group">
            <a href="{% url 'home' %}" class="btn btn-cancel">
                Bekor qilish
            </a>

            <form action="{% url 'task-delete' task.id %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete">Ha, o'chirilsin</button>
            </form>
        </div>
    </div>
</body>
</html>
